
worker_processes  auto;
worker_rlimit_nofile 65535;

events {
	worker_connections  8192;
}


http {
	http2_max_concurrent_streams 64;
	ssl_session_cache shared:SSL:20m;
	ssl_session_timeout 1h;
	ssl_protocols TLSv1.2 TLSv1.3;
	client_header_timeout 10s;
	reset_timedout_connection on;

	access_log off;

	# CookieCloud security metadata deliberately excludes paths, arguments and bodies.
	log_format cookiecloud_security escape=json '{"time":$msec,"ip":"$remote_addr",'
		'"operation":"$cookiecloud_operation","status":$status,"limited":"$limit_req_status"}';
	map $uri $cookiecloud_operation {
		default other;
		~*^/cookiecloud/get/ pull;
		~*^/cookiecloud/update/?$ update;
	}
	map $request_method $cookiecloud_client {
		default $binary_remote_addr;
		OPTIONS "";
	}
	map $uri $cookiecloud_read_key {
		default "";
		~*^/cookiecloud/get/(?<cookiecloud_uuid>[^/]+)/?$ $cookiecloud_uuid;
	}
	map $request_method $cookiecloud_limited_key {
		default $cookiecloud_read_key;
		OPTIONS "";
	}
	map $status $cookiecloud_retry_after {
		default "";
		429 60;
	}
	limit_req_zone $cookiecloud_client zone=cookiecloud_client:10m rate=5r/m;
	limit_req_zone $cookiecloud_limited_key zone=cookiecloud_key:10m rate=1r/m;

	include	   mime.types;
	default_type  application/octet-stream;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;

	keepalive_timeout  65;
	keepalive_requests 10000;

	open_file_cache max=1000 inactive=60s;
	open_file_cache_valid 30s;
	open_file_cache_min_uses 2;

	proxy_connect_timeout 10s;
	proxy_read_timeout 30s;
	proxy_send_timeout 10s;
	proxy_buffer_size 16k;
	proxy_buffers 4 32k;

	proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=tmdb_cache:10m max_size=500m inactive=24h;
	proxy_cache_path /dev/shm/nginx_recognize_cache levels=1:2 keys_zone=recognize_cache:32m max_size=512m inactive=10m use_temp_path=off;
	proxy_cache_path /dev/shm/nginx_features_cache levels=1 keys_zone=features_cache:1m max_size=1m inactive=10m use_temp_path=off;

	upstream moviepilot_server {
		server 127.0.0.1:3001;
		keepalive 64;
		keepalive_requests 10000;
		# Expire idle upstream connections before Uvicorn's default 5s timeout.
		# Keep this below SERVER_TIMEOUT_KEEP_ALIVE when changing server settings.
		keepalive_timeout 4s;
	}

	server {
		listen	80;
		listen	443 ssl http2 backlog=4096;

		root	/home/www/public;
		server_name	movie-pilot.org www.movie-pilot.org;

		ssl_certificate	/home/www/certs/movie-pilot.org.cer;
		ssl_certificate_key	/home/www/certs/movie-pilot.org.key;

		# Preserve push routes and keep bindings out of shared caches.
		location = /push {
			return 308 /push/;
		}

		# ^~ keeps notification JS, images and worker scripts out of the website cache.
		location ^~ /push/ {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host;
			proxy_set_header Authorization $http_authorization;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_pass http://moviepilot_server;
			proxy_cache off;
			proxy_no_cache 1;
			proxy_cache_bypass 1;
			proxy_hide_header Cache-Control;
			add_header Cache-Control "no-store" always;
			proxy_read_timeout 70s;
		}

		# Central knowledge stays out of website and shared caches.
		location = /knowledge {
			return 308 /knowledge/;
		}

		# Public Agent reads deliberately drop any caller Authorization header.
		location ^~ /knowledge/v1/agent/ {
			include /etc/nginx/cloudflare-realip.conf;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host;
			proxy_set_header Authorization "";
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_pass http://moviepilot_server;
			proxy_cache off;
			proxy_no_cache 1;
			proxy_cache_bypass 1;
			proxy_hide_header Cache-Control;
			add_header Cache-Control "no-store" always;
			client_max_body_size 8k;
			proxy_connect_timeout 1s;
			proxy_read_timeout 6s;
		}

		location ^~ /knowledge/ {
			include /etc/nginx/cloudflare-realip.conf;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host;
			proxy_set_header Authorization $http_authorization;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_pass http://moviepilot_server;
			proxy_cache off;
			proxy_no_cache 1;
			proxy_cache_bypass 1;
			proxy_hide_header Cache-Control;
			add_header Cache-Control "no-store" always;
			client_max_body_size 8k;
			proxy_connect_timeout 1s;
			proxy_read_timeout 6s;
		}

		# Preserve /admin/ in proxy_pass: FastAPI serves both the SPA and /admin/api/.
		location = /admin {
			return 308 /admin/;
		}

		# Stream authenticated knowledge uploads to the private Server volume, never nginx temp files.
		location = /admin/api/knowledge/imports/upload {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_pass http://moviepilot_server;
			proxy_request_buffering off;
			proxy_cache off;
			proxy_no_cache 1;
			proxy_cache_bypass 1;
			proxy_hide_header Cache-Control;
			add_header Cache-Control "no-store" always;
			client_max_body_size 64m;
			proxy_read_timeout 300s;
		}

		# ^~ prevents the generic JS/CSS/image cache rule from capturing admin assets.
		location ^~ /admin/ {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_pass http://moviepilot_server;
			proxy_cache off;
			proxy_no_cache 1;
			proxy_cache_bypass 1;
			proxy_hide_header Cache-Control;
			add_header Cache-Control "no-store" always;
			client_max_body_size 1m;
			proxy_read_timeout 300s;
		}

		location / {
			index index.html index.htm;
			try_files $uri $uri/ /index.html;
		}

		location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
			expires 7d;
			add_header Cache-Control "public, immutable";
		}

		location /captcha/ {
			proxy_pass	http://app.movie-pilot.org:9899;
		}

		# ^~ prevents a KEY ending in .js/.png from bypassing this protected route.
		location ^~ /cookiecloud/ {
			include /etc/nginx/cloudflare-realip.conf;
			# No burst allowance: pace clients at 12s and each KEY at 60s.
			limit_req zone=cookiecloud_client;
			limit_req zone=cookiecloud_key;
			limit_req_status 429;
			access_log /var/log/nginx/cookiecloud-security.log cookiecloud_security;
			# Standard error messages include the secret KEY in the request path.
			# The metadata log above retains status/limit failures for the monitor.
			error_log /dev/null;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $remote_addr;
			# Forward the same normalized URI used for KEY limits. Raw %2f/.. aliases
			# must not reach Express's decode + basename() as a different KEY.
			proxy_pass http://127.0.0.1:8088/cookiecloud/;
			proxy_cache off;
			proxy_no_cache 1;
			proxy_cache_bypass 1;
			proxy_hide_header Cache-Control;
			proxy_hide_header Access-Control-Allow-Origin;
			add_header Cache-Control "no-store" always;
			add_header Access-Control-Allow-Origin "*" always;
			add_header Retry-After $cookiecloud_retry_after always;
		}

		location /plugin/ {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_pass	http://moviepilot_server;
		}

		location /subscribe/ {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_pass	http://moviepilot_server;
		}

		location /workflow/ {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_pass	http://moviepilot_server;
		}

		location /u115/ {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_pass	http://moviepilot_server;
		}

		# Shared GET responses are eventually consistent for up to ten minutes;
		# POST reports bypass the cache and update Redis independently.
		location = /recognize/share {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_pass	http://moviepilot_server;
			proxy_connect_timeout 2s;
			proxy_send_timeout 5s;
			proxy_read_timeout 5s;
			proxy_cache recognize_cache;
			proxy_cache_key $scheme$proxy_host$request_uri;
			proxy_cache_methods GET HEAD;
			proxy_cache_valid 200 10m;
			proxy_cache_min_uses 2;
			proxy_cache_use_stale error timeout updating;
			proxy_cache_lock on;
			proxy_cache_lock_timeout 3s;
			proxy_cache_lock_age 3s;
		}

		# Durable source -> TMDB mappings must reflect corrections and revocations.
		# Instance clients cache results and bound their complete request to 800ms.
		location = /recognize/mapping {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_pass http://moviepilot_server;
			proxy_connect_timeout 1s;
			proxy_send_timeout 2s;
			proxy_read_timeout 2s;
			proxy_cache off;
			proxy_no_cache 1;
			proxy_cache_bypass 1;
			proxy_hide_header Cache-Control;
			add_header Cache-Control "no-store" always;
		}

		location /recognize/ {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_pass	http://moviepilot_server;
		}

		location /usage/ {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_pass	http://moviepilot_server;
		}

		# Global feature flags are identical for every caller, so a 60s
		# micro-cache absorbs instance polling; flag changes apply within a minute.
		location = /user/features {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_pass	http://moviepilot_server;
			proxy_cache features_cache;
			proxy_cache_key $scheme$proxy_host$uri;
			proxy_cache_methods GET HEAD;
			proxy_cache_valid 200 60s;
			proxy_cache_use_stale error timeout updating;
			proxy_cache_lock on;
			proxy_cache_lock_timeout 3s;
			proxy_cache_lock_age 3s;
		}

		# User permission API must bypass the SPA fallback.
		location /user/ {
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			proxy_pass	http://moviepilot_server;
		}

		location /status {
			stub_status on;
			access_log   off;
		}

	}

	server {
		listen	80;
		listen	443 ssl http2;

		root	/home/www/;
		server_name	wechat.movie-pilot.org;

		ssl_certificate	/home/www/certs/movie-pilot.org.cer;
		ssl_certificate_key	/home/www/certs/movie-pilot.org.key;

		location /cgi-bin/gettoken {
			proxy_pass https://qyapi.weixin.qq.com;
		}
		location /cgi-bin/message/send {
			proxy_pass	https://qyapi.weixin.qq.com;
		}
		location /status {
			stub_status on;
			access_log   off;
		}
	}

	server {
		listen	80;
		listen	443 ssl http2;

		root	/home/www/;
		server_name	tmdb.movie-pilot.org;

		ssl_certificate	/home/www/certs/movie-pilot.org.cer;
		ssl_certificate_key	/home/www/certs/movie-pilot.org.key;

		location / {
			# Resolve IPv4 dynamically so IPv4-only hosts skip unreachable AAAA records and refresh CloudFront IPs.
			resolver 127.0.0.53 valid=300s ipv6=off;
			resolver_timeout 5s;
			set $tmdb_upstream https://api.themoviedb.org;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header Host "api.themoviedb.org";
			proxy_set_header X-Protocal https;
			proxy_http_version 1.1;
			proxy_ssl_server_name on;
			proxy_pass $tmdb_upstream;

			proxy_cache tmdb_cache;
			proxy_cache_valid 200 12h;
			proxy_cache_use_stale error timeout updating;
			proxy_cache_lock on;
			add_header X-Cache-Status $upstream_cache_status;
		}
		location /status {
			stub_status on;
			access_log   off;
		}
	}

	server {
		listen	80;
		listen	443 ssl http2;

		root	/home/www/;
		server_name	wiki.movie-pilot.org;

		ssl_certificate	/home/www/certs/movie-pilot.org.cer;
		ssl_certificate_key	/home/www/certs/movie-pilot.org.key;

		location / {
			proxy_pass http://app.movie-pilot.org:3000/;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection 'upgrade';
			proxy_set_header Host $host;
			proxy_cache_bypass $http_upgrade;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
		location /status {
            stub_status on;
			access_log   off;
		}
	}

	server {
		listen	80;
		listen	443 ssl http2;

		root	/home/www/;
		server_name	api.movie-pilot.org;

		ssl_certificate	/home/www/certs/movie-pilot.org.cer;
		ssl_certificate_key	/home/www/certs/movie-pilot.org.key;

		location / {
			proxy_pass http://localhost:8888/docs;
		}

		location /api/ {
            proxy_pass http://localhost:8888/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
		location /status {
            stub_status on;
			access_log   off;
		}
	}

	server {
        listen	80;
		listen	443 ssl http2;

		root	/home/www/;
		server_name	glitchtip.movie-pilot.org;

		ssl_certificate	/home/www/certs/movie-pilot.org.cer;
		ssl_certificate_key	/home/www/certs/movie-pilot.org.key;

        client_max_body_size 40M;

        location / {
            proxy_pass http://localhost:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

}
